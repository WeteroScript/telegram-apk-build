name: Build APK from my Telegram ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Download my Telegram ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download source-archive \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Telegram-master.zip"

      - name: Extract source
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -q Telegram-master.zip -d source
          test -f source/Telegram-master/gradlew
          chmod +x source/Telegram-master/gradlew

      - name: Restore submodules
        shell: bash
        run: |
          cd source/Telegram-master

          if [ -f .gitmodules ]; then
            while read -r key path; do
              name="${key#submodule.}"
              name="${name%.path}"
              url="$(git config -f .gitmodules --get "submodule.${name}.url")"

              echo "Downloading: $name"
              rm -rf "$path"
              mkdir -p "$(dirname "$path")"

              git clone --depth 1 \
                --recurse-submodules \
                --shallow-submodules \
                "$url" "$path"
            done < <(git config -f .gitmodules \
              --get-regexp '^submodule\..*\.path$' || true)
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android tools
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK from my ZIP
        run: |
          cd source/Telegram-master
          ./gradlew :TMessagesProj_App:assembleAfatDebug \
            --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-telegram-apk
          path: source/Telegram-master/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
